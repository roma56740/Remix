<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050505">
    <meta name="description" content="RAMIX MUSIC — независимая цифровая экосистема доставки аудиоконтента на стриминговые платформы мира.">
    <title>{% block title %}RAMIX MUSIC{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    {% include "components/header.html" %}
    <main>{% block content %}{% endblock %}</main>
    {% include "components/footer.html" %}
    <script src="{{ url_for('static', path='js/main.js') }}" defer></script>
</body>
</html>
