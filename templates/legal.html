{% extends "auth_base.html" %}

{% block title %}{{ document_title }} — RAMIX MUSIC{% endblock %}

{% block content %}
<article class="auth-card legal-card" aria-labelledby="legal-title">
    <div class="auth-heading legal-heading">
        <h1 id="legal-title">{{ document_title }}</h1>
        <a class="auth-logo" href="/" aria-label="RAMIX MUSIC — на главную">
            <img src="{{ url_for('static', path='img/logo.png') }}" alt="RAMIX MUSIC">
        </a>
    </div>

    <div class="legal-copy"><pre>{{ document_text }}</pre></div>

    <div class="legal-actions">
        <a class="auth-button auth-button-outline" href="/">На главную</a>
        <a class="auth-button auth-button-primary" href="/register">К регистрации</a>
    </div>
</article>
{% endblock %}
